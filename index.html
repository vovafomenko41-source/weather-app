<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wetter App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="weather-app">

        <h1>Wetter App</h1>

        <div class="search-box">
            <input type="text"
                   id="cityInput" aria-label="Stadt"
                   placeholder="Stadt eingeben..."
                   autocomplete="off">

            <button id="searchButton">Suchen</button>
        </div>

        <p id="errorMessage" class="error" role="status" aria-live="polite"></p>

        <section class="weather-card">

            <div class="location">
                <h2 id="city">Stadt</h2>
                <p id="country">--</p>
            </div>

            <div class="weather-main">

                <span id="weatherIcon" role="img" aria-label="Wetter">🌤️</span>

                <div>
                    <span id="temperature">--</span>
                    <span class="degree">°C</span>
                </div>

            </div>

            <p id="description" class="description">
                Wetterinformationen
            </p>

            <div class="weather-info">

                <div class="info-box">
                    <span class="info-icon">💧</span>
                    <p>Luftfeuchtigkeit</p>
                    <strong id="humidity">-- %</strong>
                </div>

                <div class="info-box">
                    <span class="info-icon">💨</span>
                    <p>Wind</p>
                    <strong id="wind">-- km/h</strong>
                </div>

                <div class="info-box">
                    <span class="info-icon">🌡️</span>
                    <p>Gefühlt</p>
                    <strong id="feelsLike">-- °C</strong>
                </div>

                <div class="info-box">
                    <span class="info-icon">🔵</span>
                    <p>Luftdruck</p>
                    <strong id="pressure">-- hPa</strong>
                </div>

            </div>

        </section>

        <p id="updatedAt" class="updated-at"></p>
        <p class="footer">
            Wetterdaten: <a href="https://open-meteo.com/">Open-Meteo</a> · Orte: <a href="https://www.geonames.org/">GeoNames</a>
        </p>

    </main>

    <script src="script.js"></script>

</body>

</html>
